name: Unpack MAMAHAIR project

on:
  push:
    paths:
      - 'payload/part-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-* > /tmp/mamahair.b64
          base64 -d /tmp/mamahair.b64 > /tmp/mamahair.zip
          mkdir -p /tmp/unpacked
          unzip -q /tmp/mamahair.zip -d /tmp/unpacked
          shopt -s dotglob
          cp -a /tmp/unpacked/mamahair/* .
          rm -rf payload
      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy stabilized MAMAHAIR project' || exit 0
          git push
